<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050d" />
    <title>Stella Nova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <style>
      :root {
        color-scheme: dark;
        --sn-night: #03050d;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--sn-night);
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: relative;
        height: 100%;
        overflow: hidden;
        background: var(--sn-night);
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
