<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NORDLYS · audio harness</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #050b1a; color: #cfe3ff; font: 13px/1.35 system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
    h1 { font-size: 15px; letter-spacing: .25em; margin: 4px 0 10px; color: #eaf8ff; }
    h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #7f93b2; margin: 16px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { background: #0f2240; color: #dff0ff; border: 1px solid #23406b; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    button:hover { background: #163058; }
    button.big { font-size: 15px; padding: 10px 18px; background: #0f3b2e; border-color: #1f7a5c; }
    button.storm { border-color: #7a1f38; background: #2a0c18; }
    label { color: #9fb4d4; }
    #status { font: 12px ui-monospace, monospace; color: #8fe3c0; white-space: pre; background: #07122a; padding: 8px; border-radius: 8px; min-height: 3em; }
    canvas { width: 100%; height: 120px; background: #030814; border-radius: 8px; display: block; }
    pre#out { font: 11px ui-monospace, monospace; color: #b8c9e8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>NORDLYS · AUDIO</h1>
    <div class="row"><button class="big" id="unlock">Tænd lyden (unlock)</button> <button id="runCheck">Kør check</button></div>
    <h2>Status</h2>
    <div id="status">locked</div>
    <canvas id="scope" width="960" height="120"></canvas>
    <div id="ui"></div>
    <pre id="out"></pre>
  </main>
  <script type="module" src="./audio.ts"></script>
</body>
</html>
