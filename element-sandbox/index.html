<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Element Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e8eaf0;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
      }

      /* --- paneler (solid moerk baggrund, som v4.5+) --- */
      .panel {
        position: fixed;
        background: rgba(22, 24, 32, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 5px 8px;
        box-sizing: border-box;
        z-index: 10;
      }
      #top-panel {
        top: 8px;
        left: 8px;
        right: 8px;
      }
      .tab-row {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-wrap: wrap;
      }
      .palette-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      button.chip {
        border-radius: 4px;
        padding: 3px 9px;
        font-size: 14px;
        font-family: inherit;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #22242e;
        color: #f2f2f8;
        cursor: pointer;
        white-space: nowrap;
      }
      button.chip:hover {
        filter: brightness(1.25);
      }
      .version {
        font-size: 12px;
        color: rgba(158, 166, 189, 0.8);
        margin-left: 4px;
      }
      #bottom-bar {
        bottom: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        min-height: 32px;
      }
      #sel-chip {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        flex: none;
        display: inline-block;
      }
      #hint-label {
        flex: 1;
        text-align: center;
        font-size: 13px;
        color: #9ea6bd;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #state-label {
        white-space: nowrap;
      }

      /* --- udfordrings-HUD --- */
      #hud-panel {
        right: 8px;
        top: 150px;
        width: 328px;
        max-width: calc(100vw - 16px);
        display: block;
      }
      #hud-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      #hud-desc {
        color: #d9dcE8;
        font-size: 14px;
        margin-bottom: 6px;
      }
      #hud-best {
        color: #f2d973;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .progress {
        height: 12px;
        background: #242835;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .progress > div {
        height: 100%;
        width: 0%;
        background: #4a9df0;
        border-radius: 4px;
        transition: width 0.15s linear;
      }
      #hud-status {
        font-size: 14px;
        min-height: 18px;
        margin-bottom: 6px;
      }
      .hud-buttons {
        display: flex;
        gap: 6px;
      }

      /* --- udfordringsvaelger --- */
      #select-panel {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(600px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        z-index: 20;
      }
      #select-title {
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }
      button.select-item {
        text-align: left;
        min-height: 36px;
        font-size: 14px;
      }
      button.select-close {
        align-self: center;
        min-width: 120px;
      }

      /* --- eksplosions-flash --- */
      #flash {
        position: fixed;
        inset: 0;
        background: rgb(255, 237, 204);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      /* --- startmenu --- */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: #0b0d12;
      }
      #menu-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #menu-dim {
        position: absolute;
        inset: 0;
        background: rgba(5, 5, 10, 0.38);
      }
      #menu-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 16px;
      }
      #menu-center h1 {
        font-size: clamp(34px, 7vw, 54px);
        margin: 0;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.9);
      }
      .menu-sub {
        margin: 0;
        color: #d9deed;
      }
      #menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .menu-size-btn {
        width: min(380px, 86vw);
        min-height: 46px;
        font-size: 16px;
        font-family: inherit;
        color: #f2f2f8;
        background: rgba(34, 38, 50, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        cursor: pointer;
      }
      .menu-size-btn:hover {
        filter: brightness(1.3);
      }
      .menu-hint {
        margin: 0;
        color: #9ea6bd;
        font-size: 13px;
      }
      #menu-version {
        position: absolute;
        top: 6px;
        right: 10px;
        font-size: 12px;
        color: rgba(140, 148, 168, 0.8);
      }

      /* --- touch/mobil: knapper >= 40 px --- */
      @media (pointer: coarse), (max-width: 700px) {
        button.chip {
          min-height: 40px;
          padding: 8px 12px;
          font-size: 15px;
        }
        #hint-label {
          display: none;
        }
        .menu-size-btn {
          min-height: 48px;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BbZ8VR5V.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
