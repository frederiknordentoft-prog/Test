<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LYSBRUD — badge-forhåndsvisning</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 32px 60px;
    background: #07091c;
    color: #eef1ff;
    font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  h1 { font-size: 17px; letter-spacing: .10em; text-transform: uppercase; color: #d5a63f; margin: 0 0 4px; }
  p.note { margin: 0 0 26px; color: #98a0c8; }
  h2 {
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: #98a0c8; margin: 30px 0 12px; font-weight: 600;
  }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .cell {
    /* samme baggrund som en hjulcelle */
    background: linear-gradient(150deg, #161a4a, #0d1030 62%, #0a0c26);
    border: 1px solid rgba(213,166,63,.22);
    border-radius: 5px;
    padding: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .cell.plain { background: #0d1030; }
  .cell canvas { display: block; }
  .cap { font-size: 10px; letter-spacing: .05em; color: #98a0c8; }
  .toolbar { display: flex; gap: 18px; align-items: center; margin-bottom: 8px; color: #98a0c8; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<h1>Lysbrud — badge-forhåndsvisning</h1>
<p class="note">Wild-badge og glimt tegnet procedurelt på hjulcellens baggrund. Ingen billedfiler.</p>

<div class="toolbar">
  <label>glød <input type="range" id="opt-glow" min="0" max="3" step="0.1" value="1" /></label>
  <span id="opt-glow-val">1.0</span>
  <label>tændt <input type="range" id="opt-lit" min="0" max="1.5" step="0.1" value="0" /></label>
  <span id="opt-lit-val">0.0</span>
  <label><input type="checkbox" id="opt-rot" /> roteret 15°</label>
</div>

<div id="out"></div>

<script type="module">
import { drawWildBadge, drawGlint } from '../src/art/badges.js';
import { makeRng } from '../src/rng.js';

const SIZES = [36, 60, 140];
const MULTS = [1, 2, 3, 5];
const DPR = Math.min(2, window.devicePixelRatio || 1);
const out = document.getElementById('out');
const optGlow = document.getElementById('opt-glow');
const optLit = document.getElementById('opt-lit');
const optRot = document.getElementById('opt-rot');
const glowVal = document.getElementById('opt-glow-val');
const litVal = document.getElementById('opt-lit-val');

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * DPR);
  c.height = Math.round(h * DPR);
  c.style.width = w + 'px';
  c.style.height = h + 'px';
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  return { el: c, g: g };
}

function cell(el, caption, plain) {
  const d = document.createElement('div');
  d.className = 'cell' + (plain ? ' plain' : '');
  d.appendChild(el);
  const s = document.createElement('span');
  s.className = 'cap';
  s.textContent = caption;
  d.appendChild(s);
  return d;
}

function section(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
  const r = document.createElement('div');
  r.className = 'row';
  out.appendChild(r);
  return r;
}

function badgeChip(size, mult, opts) {
  const w = Math.round(size * 1.35), h = Math.round(size * 1.55);
  const c = canvas(w, h);
  drawWildBadge(c.g, w / 2, size * 0.72, size, mult, opts);
  return c.el;
}

function glintChip(size, color, rotation) {
  const s = Math.round(size * 1.3) + 8;
  const c = canvas(s, s);
  drawGlint(c.g, s / 2, s / 2, size, 1, rotation, color);
  return c.el;
}

function render() {
  out.textContent = '';
  const opts = {
    glow: Number(optGlow.value),
    lit: Number(optLit.value),
    rotation: optRot.checked ? Math.PI / 12 : 0,
  };
  glowVal.textContent = Number(optGlow.value).toFixed(1);
  litVal.textContent = Number(optLit.value).toFixed(1);

  for (const size of SIZES) {
    const row = section('wild-badge · ' + size + ' px');
    for (const m of MULTS) row.appendChild(cell(badgeChip(size, m, opts), 'x' + m, false));
  }

  const flat = section('flad baggrund · 60 px (kontrolgruppe for kontur og glød)');
  for (const m of MULTS) flat.appendChild(cell(badgeChip(60, m, opts), 'x' + m, true));

  const glints = section('glimt · størrelser og farver');
  const colours = ['#ffffff', '#9cc3ff', '#ffcf5e', '#5fe3d3', '#ff6cc0'];
  [8, 14, 24, 40, 70].forEach((size, i) => {
    colours.forEach((col, j) => {
      const rot = ((i + j) % 4) * Math.PI / 8;
      glints.appendChild(cell(glintChip(size, col, rot), size + ' px', true));
    });
  });

  /* tæthedsprøve: 300 glimt med fast frø, som partikelsystemet vil bruge dem */
  const storm = section('glimt-tæthed · 300 stk., deterministisk frø');
  const W = 520, H = 200;
  const c = canvas(W, H);
  c.g.fillStyle = '#0d1030';
  c.g.fillRect(0, 0, W, H);
  const rng = makeRng('preview-badges');
  for (let i = 0; i < 300; i++) {
    const col = colours[Math.floor(rng() * colours.length)];
    drawGlint(c.g, rng() * W, rng() * H, 4 + rng() * rng() * 34, 0.35 + rng() * 0.65, rng() * Math.PI, col);
  }
  storm.appendChild(cell(c.el, '300 glimt', true));
}

for (const el of [optGlow, optLit, optRot]) el.addEventListener('input', render);
render();
</script>
</body>
</html>
