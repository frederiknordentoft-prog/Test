<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><title>QA baggrund</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { createBackdrop, drawAmbient } from '../src/art/backdrop.js';
const W = innerWidth, H = innerHeight;
const c = document.getElementById('c'); c.width=W; c.height=H;
const g = c.getContext('2d');
const bd = createBackdrop(W, H, 20260903);
g.drawImage(bd.canvas, 0, 0, W, H);
for (let i=0;i<40;i++) drawAmbient(g, W, H, i*33, 1);
document.title='klar';
</script></body></html>
