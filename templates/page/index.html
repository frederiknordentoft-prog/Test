<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Min nye side</title>
<meta name="description" content="Kort beskrivelse af siden." />
<meta name="theme-color" content="#0b5cff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E" />

<style>
  :root {
    --bg: #f3f4f8; --surface: #fff; --ink: #16181d; --ink-2: #5b606b; --line: #e7e9f0;
    --accent: #0b5cff;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 30px rgba(16,24,40,.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0b; --surface: #16171a; --ink: #f2f3f5; --ink-2: #a8adb8; --line: #26282d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.45); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    padding: 28px 20px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 640px; margin: 0 auto; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 22px;
    color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600;
  }
  .back:hover { color: var(--accent); }
  h1 { font-size: 32px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 6px; }
  .lead { color: var(--ink-2); font-size: 15px; margin-bottom: 26px; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px; box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Relativ sti — virker både lokalt og under /Test/<slug>/ -->
  <a class="back" href="../">‹ Alle apps</a>

  <h1>Min nye side</h1>
  <p class="lead">Erstat det her med din app.</p>

  <div class="panel">
    <p>Indhold her.</p>
  </div>
</div>

<script>
  // Din kode her. Husk: alle stier skal være relative (./fil.js, ikke /fil.js),
  // ellers peger de på sitets rod i stedet for din undermappe.
</script>

</body>
</html>
