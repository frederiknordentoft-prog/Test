<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><title>Symbols preview</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;background:#fbfbfd;color:#1d1d1f;padding:24px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:760px}
.cell{background:#f5f5f7;border-radius:20px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.cell canvas{width:100%;height:100%}
.dark{background:#000;color:#f5f5f7;margin-top:24px;padding:24px;border-radius:28px}
.dark .cell{background:#2c2c2e}
.big{display:flex;gap:16px;margin-top:24px}
.big .cell{width:220px}
</style></head><body>
<div class="grid" id="light"></div>
<div class="dark"><div class="grid" id="dark"></div></div>
<div class="big" id="big"></div>
<script src="../js/art.js"></script>
<script>
const ids=['WILD','SCAT','H1','H2','H3','H4','L1','L2','L3','L4'];
const dpr=Math.min(2.5,devicePixelRatio||1);
function fill(el,theme,px){ ids.forEach(id=>{const d=document.createElement('div');d.className='cell';const c=SlotArt.symbol(id,Math.round(px*dpr),dpr,theme);c.style.width=c.style.height='100%';d.appendChild(c);el.appendChild(d);}); }
fill(document.getElementById('light'),'light',140);
fill(document.getElementById('dark'),'dark',140);
const big=document.getElementById('big'); ['WILD','SCAT','H1','H4'].forEach(id=>{const d=document.createElement('div');d.className='cell';d.appendChild(SlotArt.symbol(id,Math.round(220*dpr),dpr,'light'));big.appendChild(d);});
</script></body></html>
